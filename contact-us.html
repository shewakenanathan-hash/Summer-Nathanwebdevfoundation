<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - My Car Dealership</title>
</head>
<body>
  
</body>
</html>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    

    <section class="contact-section">

        <h1>Contact Us</h1>
        <p>Have a question or want to tell us about your experience?</p>

        <form
            action="https://formspree.io/f/mnpajdld"
            method="POST"
            class="contact-form"
        >

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
            >

            <label for="car">Which car are you interested in?</label>

            <select id="car" name="car">
                <option value="">Select a car</option>
                <option value="Toyota Corolla">Toyota Corolla</option>
                <option value="BMW 3 Series">BMW 3 Series</option>
                <option value="Mercedes C-Class">Mercedes C-Class</option>
                
            </select>

            <label>Rate your experience</label>

            <div class="rating">
                <label>
                    <input type="radio" name="rating" value="1 star">
                    ⭐
                </label>

                <label>
                    <input type="radio" name="rating" value="2 stars">
                    ⭐⭐
                </label>

                <label>
                    <input type="radio" name="rating" value="3 stars">
                    ⭐⭐⭐
                </label>

                <label>
                    <input type="radio" name="rating" value="4 stars">
                    ⭐⭐⭐⭐
                </label>

                <label>
                    <input type="radio" name="rating" value="5 stars">
                    ⭐⭐⭐⭐⭐
                </label>
            </div>

            <label for="message">Your Message</label>

            <textarea
                id="message"
                name="message"
                rows="6"
                placeholder="Tell us what you think..."
                required
            ></textarea>

            <button type="submit">Send Message</button>

        </form>

    </section>

</body>
</html>
  </title>
</head>
